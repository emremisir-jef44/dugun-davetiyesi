        :root {
            --krem: #f4ede4; 
            --acik-krem: #fbf9f6; 
            --yesil: #617063; 
            --koyu-yesil: #1c261e; 
            --altin: #c2a770; 
            --yazi: #2c362e;
            --gri: #68736a;
            --hata: #a33a3a;
            
            --font-isim: 'Alex Brush', cursive; 
            --font-baslik: 'Cinzel', serif; 
            --font-metin: 'Lora', serif; 
        }

        * { box-sizing: border-box; }
        html { scroll-behavior: smooth; }
        body { margin: 0; font-family: var(--font-metin); background: linear-gradient(180deg, #fbf9f6 0%, #ffffff 50%, #fbf9f6 100%); color: var(--yazi); line-height: 1.8; font-weight: 400; }
        body.kilitli { overflow: hidden; }

        /* ZARF AÇILIŞ EKRANI (SADECE VİDEO İÇİN GÜNCELLENDİ) */
        .acilis-ekrani { position: fixed; inset: 0; z-index: 9999; display: flex; align-items: center; justify-content: center; background-color: #f7f3ec; transition: opacity 1.2s ease, visibility 1.2s ease; cursor: pointer; }
        .acilis-ekrani.gizli { opacity: 0; visibility: hidden; pointer-events: none; }
        .zarf-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

        /* BUTONLAR */
        .buton { display: inline-block; padding: 14px 32px; border: none; border-radius: 999px; background-color: var(--koyu-yesil); color: white; text-decoration: none; font-size: 13px; font-weight: 500; letter-spacing: 1.5px; text-transform: uppercase; cursor: pointer; transition: all 0.3s ease; font-family: var(--font-metin); }
        .buton:hover { transform: translateY(-2px); background-color: var(--altin); box-shadow: 0 10px 20px rgba(194, 167, 112, 0.2); }
        .buton:disabled { opacity: 0.65; cursor: wait; transform: none; }
        
        .buton.seffaf { background-color: transparent; border: 1px solid var(--koyu-yesil); color: var(--koyu-yesil); }
        .buton.seffaf:hover { background-color: var(--koyu-yesil); color: white; }
        
        .buton-grubu { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; margin-bottom: 45px; pointer-events: auto;}

        /* MÜZİK */
        .muzik-buton { position: fixed; bottom: 20px; right: 20px; z-index: 999; background-color: var(--altin); color: white; border: none; border-radius: 50%; width: 55px; height: 55px; font-size: 24px; cursor: pointer; box-shadow: 0 4px 15px rgba(0,0,0,0.15); transition: transform 0.3s ease, background-color 0.3s ease; display: flex; align-items: center; justify-content: center; }
        .muzik-buton:hover { background-color: #a88d57; transform: scale(1.1); }
        .muzik-buton.caliyor { animation: nabiz 2s infinite; }
        @keyframes nabiz { 0% { transform: scale(1); box-shadow: 0 0 0 0 rgba(194, 167, 112, 0.5); } 70% { transform: scale(1.05); box-shadow: 0 0 0 15px rgba(194, 167, 112, 0); } 100% { transform: scale(1); box-shadow: 0 0 0 0 rgba(194, 167, 112, 0); } }
